# config/watchlist_expected.yml -- C-3.1 ground truth: the correct ATS mapping
# for every config/watchlist.yml entry, keyed by domain.
#
# Kept separate from watchlist.yml on purpose: SPEC.md §7.1 keeps the
# watchlist as name + domain only, so the cascade sees exactly what it would
# see for any other company. This file is only read by
# `python -m src.mapping --check-watchlist`, which scores the cascade against it.
#
# Provenance (2026-09-24): every token below was live-probed on its own, not
# produced by the cascade under test.
#   - The 14 entries added 2026-09-24 (BambooHR, Workable, Personio, Breezy,
#     Volta, OhmConnect) were run through the real src/ats_*.py adapters and
#     then hand-checked by the user.
#   - The 16 remaining original M1 entries were hand-checked by the user in
#     M1, but M1 never recorded their tokens. Re-derived today: 13 by
#     live-probing the obvious board slug (each confirmed live; the 5
#     Greenhouse boards also return the company's own name), and Stem
#     (`stem-inc`), goTenna (`gotenna-inc`) and Algorand
#     (`algorand-foundation`, careers page lives on algorand.co) by reading
#     each careers page's Rippling links by eye. Confirmed by the user
#     2026-09-24 (the boards hand-checked in M1).
#
# Personio's "token" is the full tenant host (src/ats_personio.py takes a host).
# zero_postings: true marks the "mapped, zero jobs" case.

