# config/watchlist.yml -- SPEC.md §7.1: manual watchlist, name + domain only.
# Highest-signal source per unit of effort, and this becomes M3's ground-truth
# set (BUILD.md M1) -- so entries here should be companies whose ATS you
# already know, not just whatever an automated cascade already flagged.
#
# This first batch of 23 was selected from spikes/discovered_companies.csv's
# `verified` mapping tier plus spikes/iteration11_rippling_tokens.csv, spread
# across the four ATS providers that already have live-tested parsers in
# spikes/ (Greenhouse, Ashby, Lever, Rippling). Hand-checked against the
# spike's own known false-positive shapes (DEVLOG.md, iterations 3 and 6):
# excludes VC/PE-fund domains, CDN/asset subdomains, and parked or dead
# domains that turned up elsewhere in that data. More to be added -- see
# DEVLOG.md's session notes for this milestone.

