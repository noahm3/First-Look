# config/watchlist.yml -- SPEC.md §7.1: manual watchlist, name + domain only.
# Highest-signal source per unit of effort, and this becomes M3's ground-truth
# set (BUILD.md M1) -- so entries here should be companies whose ATS you
# already know, not just whatever an automated cascade already flagged.
#
# This batch (13) comes from the user's own multi-year, hand-compiled company
# list (kept outside the repo, never committed as-is -- only company name and
# domain are pulled from it here). Each careers-page link was independently
# re-verified live via spikes/iteration13_personal_list_verify.py (a fresh
# HTTP fetch + ATS fingerprint, not a reuse of the mapping-cascade spike's own
# output), so this is doubly-anchored: personally known, and freshly
# confirmed still live and still on the same ATS today. Replaces an earlier
# batch drawn from the automated discovery spikes' "verified" tier -- that
# data was the mapping cascade's own output, which made it a weaker ground
# truth for the very cascade M3 exists to test.
#
# One candidate deliberately excluded pending a manual check: Spiro
# Technologies' careers link now redirects to a Greenhouse board under the
# token `cordance`, not `spiro` -- looks like an acquisition or rebrand, not
# confirmed.

