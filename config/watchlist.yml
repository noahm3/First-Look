# config/watchlist.yml -- SPEC.md §7.1: manual watchlist, name + domain only.
# Highest-signal source per unit of effort, and this becomes M3's ground-truth
# set (BUILD.md M1) -- so entries here should be companies whose ATS you
# already know, not just whatever an automated cascade already flagged.
#
# Every entry below was confirmed against the ATS's real public jobs API
# (not a string match in page HTML -- see spikes/iteration14_api_verify.py,
# built after a page-content check produced two false positives: CircleCI's
# only "greenhouse" mention was a cookie-consent allowlist entry, and Machine
# Metrics had a dead, leftover Greenhouse embed pointing at a 404 token), and
# then hand-clicked and confirmed live by the user.
#
# 8 of these (5 Greenhouse, 3 Lever) came from the user's own multi-year,
# hand-compiled company list (kept outside the repo -- only name and domain
# are pulled from it here). The rest (Crusoe on Ashby; Palantir and Ro on
# Lever; all four Rippling entries) are spike-sourced supplements added to
# cover Ashby and Rippling, which barely appear in that older list -- also
# hand-confirmed live, same as the rest.
#
# Appcues' Lever board is live and correctly mapped but has 0 open roles as
# of 2026-09-23 -- kept anyway: a mapped board with zero current postings is
# still a real, useful ground-truth case (the cascade should say "mapped,
# zero jobs," not "unmapped" or "weak").

